<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<title>LifeOS 리포트</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --text:#1a1d21; --muted:#6b7280; --line:#e3e6ea;
  --accent:#2563eb; --up:#d92d20; --down:#1d4ed8; --warn-bg:#fff8e6; --warn-line:#f0c36d;
  --chip:#eef1f5;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1216; --card:#171b21; --text:#e6e8eb; --muted:#9aa3ad; --line:#272c33;
    --accent:#6ea8fe; --up:#ff6b60; --down:#7aa2ff; --warn-bg:#2a2418; --warn-line:#5c4a1f;
    --chip:#212730;
  }
}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--text);
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic','맑은 고딕',sans-serif;
  font-size:17px; line-height:1.65; -webkit-text-size-adjust:100%}
.wrap{max-width:820px; margin:0 auto; padding:12px 14px 56px}
nav.tabs{display:flex; gap:6px; margin:2px 0 12px; overflow-x:auto}
nav.tabs a{flex:0 0 auto; padding:7px 13px; border-radius:999px; background:var(--chip);
  color:var(--muted); text-decoration:none; font-size:14px; font-weight:600; white-space:nowrap}
nav.tabs a.on{background:var(--accent); color:#fff}
header.top{padding:4px 2px 12px}
header.top .kicker{font-size:13px; color:var(--muted); letter-spacing:.04em}
header.top h1{margin:2px 0 0; font-size:25px; line-height:1.25; letter-spacing:-.02em}
header.top .sub{margin-top:6px; font-size:13px; color:var(--muted)}
section.card{background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:14px 16px; margin:12px 0}
h2{font-size:18px; margin:2px 0 10px; letter-spacing:-.01em}
h3{font-size:16px; margin:16px 0 6px; color:var(--muted)}
p{margin:9px 0}
ul{margin:9px 0; padding-left:19px}
li{margin:5px 0}
code{background:var(--bg); border:1px solid var(--line); border-radius:5px; padding:1px 5px; font-size:14px}
a{color:var(--accent)}
.up{color:var(--up); font-weight:700; font-variant-numeric:tabular-nums}
.down{color:var(--down); font-weight:700; font-variant-numeric:tabular-nums}
.flat{color:var(--muted); font-variant-numeric:tabular-nums}
/* 표는 절대 본문을 밀지 않는다 — 자기 안에서만 가로 스크롤 */
.tw{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:10px -2px; padding-bottom:2px}
table{border-collapse:collapse; width:100%; font-size:15px; min-width:min(100%,340px)}
th,td{padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap}
th{font-size:13px; color:var(--muted); font-weight:600; background:var(--bg)}
tr:last-child td{border-bottom:0}
td:first-child,th:first-child{white-space:normal}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
.note{background:var(--warn-bg); border:1px solid var(--warn-line); border-radius:10px;
  padding:10px 12px; margin:12px 0; font-size:14px}
.lead{font-size:16px; background:var(--chip); border-radius:10px; padding:12px 14px; margin:10px 0}
.lead ul{margin:0; padding-left:18px}
footer{margin-top:26px; padding-top:14px; border-top:1px solid var(--line); font-size:13px; color:var(--muted)}
footer a{display:inline-block; margin-right:12px}
.arch{list-style:none; padding:0}
.arch li{margin:0; border-bottom:1px solid var(--line)}
.arch a{display:block; padding:13px 2px; text-decoration:none; color:var(--text); font-size:16px}
.arch .d{color:var(--muted); font-size:13px; margin-left:6px}

.lock{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); z-index:50}
.lock .box{text-align:center; padding:24px; max-width:360px}
.lock .ico{font-size:52px}
.lock h1{margin:8px 0 4px; font-size:24px}
.lock .sub{color:var(--muted); font-size:14px}
.lock button{margin-top:20px; background:var(--accent); color:#fff; border:0; padding:14px 28px; border-radius:28px; font-weight:700; font-size:16px; cursor:pointer}
.lock .st{margin-top:14px; color:var(--muted); font-size:14px}
.lock .er{margin-top:10px; color:var(--up); font-size:14px; white-space:pre-line}
.lock.resuming button,.lock.resuming .sub{display:none}
.lock.resuming .st:empty::after{content:'불러오는 중…'}
.hidden{display:none !important}
nav.tabs a{cursor:pointer}
.bar{display:flex; justify-content:space-between; align-items:center; gap:8px; margin:0 0 6px; font-size:13px; color:var(--muted)}
.bar a{cursor:pointer}
.lbl{display:inline-block; font-size:12px; padding:1px 7px; border-radius:999px; background:var(--chip); color:var(--muted); margin-left:6px}
</style>
</head>
<body>
<div id="lock" class="lock"><div class="box">
  <div class="ico">📈</div>
  <h1>LifeOS 리포트</h1>
  <div class="sub">미국증시 브리핑 · 아마존 순위 · APR 조사 보고서<br>본인 구글 계정으로 로그인합니다</div>
  <button id="btn-login">구글 계정으로 로그인</button>
  <div id="lock-st" class="st"></div>
  <div id="lock-er" class="er"></div>
</div></div>
<script>
  // 로그인했던 기기면 버튼 대신 "불러오는 중…"을 먼저 보인다 (다른 웹앱과 같은 방식)
  try { if (localStorage.getItem('reports_signed_in') === '1') document.getElementById('lock').classList.add('resuming'); } catch (e) {}
</script>

<div id="app" class="wrap hidden">
  <nav class="tabs">
    <a data-kind="brief">미국증시</a><a data-kind="amazon">아마존 순위</a><a data-kind="research">조사 보고서</a>
  </nav>
  <div class="bar"><span id="bar-left"></span><span><a id="bar-list">지난 회차</a> · <a id="bar-out">로그아웃</a></span></div>
  <header class="top">
    <div class="kicker" id="kicker"></div>
    <h1 id="heading"></h1>
    <div class="sub" id="sub"></div>
  </header>
  <div id="body"></div>
  <footer><div>개인 기록용 자동 생성 페이지입니다. 투자 자문이 아닙니다.</div></footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const KINDS = { brief: '미국증시 브리핑', amazon: 'medicube 아마존 5개국', research: 'APR 조사 보고서' };
  const WD = ['일', '월', '화', '수', '목', '금', '토'];
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  firebase.initializeApp({"apiKey":"AIzaSyAPXiob8XeDunXpDMsLod_TwClqg2JL260","authDomain":"minsung-buboo2.firebaseapp.com","databaseURL":"https://minsung-buboo2-default-rtdb.asia-southeast1.firebasedatabase.app","projectId":"minsung-buboo2"});
  const auth = firebase.auth(), db = firebase.database();
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});
  const setSt = m => $('lock-st').textContent = m || '';
  const setEr = m => $('lock-er').textContent = m || '';

  $('btn-login').onclick = async () => {
    setEr(''); setSt('구글 로그인 창을 여는 중…');
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    try { await auth.signInWithPopup(provider); }
    catch (e) {
      if (['auth/popup-blocked', 'auth/popup-closed-by-user', 'auth/cancelled-popup-request', 'auth/operation-not-supported-in-this-environment'].includes(e.code)) {
        try { await auth.signInWithRedirect(provider); return; } catch (e2) { e = e2; }
      }
      setSt(''); setEr('로그인 실패: ' + (e.code || e.message));
    }
  };
  $('bar-out').onclick = () => auth.signOut();

  // ── 상태 ──
  const index = {};      // kind → [{date, ...meta}] 최신순
  const bodies = {};     // kind/date → html
  let cur = { kind: 'brief', date: null, list: false };

  function parseHash() {
    const m = /^#(brief|amazon|research)(?:\/(list|\d{4}-\d{2}-\d{2}))?/.exec(location.hash);
    if (!m) return { kind: 'brief', date: null, list: false };
    return { kind: m[1], date: m[2] && m[2] !== 'list' ? m[2] : null, list: m[2] === 'list' };
  }
  function go(kind, date, list) { location.hash = '#' + kind + (list ? '/list' : date ? '/' + date : ''); }

  async function loadIndex(kind) {
    if (index[kind]) return index[kind];
    const snap = await db.ref('reports/index/' + kind).get();
    const v = snap.val() || {};
    index[kind] = Object.keys(v).sort().reverse().map(d => Object.assign({ date: d }, v[d]));
    return index[kind];
  }
  async function loadBody(kind, date) {
    const k = kind + '/' + date;
    if (bodies[k]) return bodies[k];
    const snap = await db.ref('reports/body/' + kind + '/' + date).get();
    bodies[k] = (snap.val() || {}).html || '<section class="card"><p>본문이 없습니다.</p></section>';
    return bodies[k];
  }

  function fmt(d) { const dt = new Date(d + 'T00:00:00'); return (dt.getMonth() + 1) + '월 ' + dt.getDate() + '일 (' + WD[dt.getDay()] + ')'; }

  async function render() {
    cur = parseHash();
    document.querySelectorAll('nav.tabs a').forEach(a => a.classList.toggle('on', a.dataset.kind === cur.kind));
    $('body').innerHTML = '<section class="card"><p class="flat">불러오는 중…</p></section>';
    $('kicker').textContent = KINDS[cur.kind]; $('heading').textContent = ''; $('sub').textContent = '';
    $('bar-left').textContent = '';
    let list;
    try { list = await loadIndex(cur.kind); }
    catch (e) { $('body').innerHTML = '<section class="card"><p>불러오기 실패: ' + esc(e.code || e.message) + '</p></section>'; return; }
    if (!list.length) { $('heading').textContent = '아직 회차가 없습니다'; $('body').innerHTML = ''; return; }

    if (cur.list) {
      $('heading').textContent = '지난 회차'; $('sub').textContent = list.length + '건';
      $('body').innerHTML = '<section class="card"><ul class="arch">' + list.map(it =>
        '<li><a href="#' + cur.kind + '/' + it.date + '">' + esc(it.heading || fmt(it.date)) +
        (it.label ? '<span class="lbl">' + esc(it.label) + '</span>' : '') +
        '<span class="d">' + it.date + '</span></a></li>').join('') + '</ul></section>';
      return;
    }
    const date = cur.date && list.some(it => it.date === cur.date) ? cur.date : list[0].date;
    const meta = list.find(it => it.date === date);
    const pos = list.findIndex(it => it.date === date);
    $('heading').textContent = meta.heading || fmt(date);
    $('sub').textContent = meta.sub || date;
    $('bar-left').innerHTML =
      (pos < list.length - 1 ? '<a href="#' + cur.kind + '/' + list[pos + 1].date + '">‹ 이전</a> ' : '') +
      (pos > 0 ? ' <a href="#' + cur.kind + '/' + list[pos - 1].date + '">다음 ›</a>' : '') +
      (pos === 0 ? '<span>최신</span>' : '');
    try { $('body').innerHTML = await loadBody(cur.kind, date); }
    catch (e) { $('body').innerHTML = '<section class="card"><p>본문 불러오기 실패: ' + esc(e.code || e.message) + '</p></section>'; }
    window.scrollTo(0, 0);
  }

  document.querySelectorAll('nav.tabs a').forEach(a => a.onclick = () => go(a.dataset.kind));
  $('bar-list').onclick = () => go(cur.kind, null, true);
  window.addEventListener('hashchange', render);

  auth.onAuthStateChanged(async user => {
    if (!user) {
      try { localStorage.removeItem('reports_signed_in'); } catch (e) {}
      $('lock').classList.remove('resuming', 'hidden'); $('app').classList.add('hidden'); setSt(''); return;
    }
    setSt('불러오는 중…');
    try {
      // 권한 확인 겸 첫 목록. 규칙이 막으면 permission-denied
      await loadIndex(parseHash().kind);
      try { localStorage.setItem('reports_signed_in', '1'); } catch (e) {}
      $('lock').classList.add('hidden'); $('app').classList.remove('hidden');
      render();
    } catch (e) {
      setSt(''); $('lock').classList.remove('resuming');
      setEr('이 계정은 읽기 권한이 없습니다 (' + user.email + ')\n' + (e.code || e.message));
      await auth.signOut();
    }
  });
})();
</script>
</body></html>
