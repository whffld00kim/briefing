<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<title>LifeOS 리포트</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --text:#1a1d21; --muted:#6b7280; --line:#e3e6ea;
  --accent:#2563eb; --up:#d92d20; --down:#1d4ed8; --warn-bg:#fff8e6; --warn-line:#f0c36d;
  --chip:#eef1f5;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1216; --card:#171b21; --text:#e6e8eb; --muted:#9aa3ad; --line:#272c33;
    --accent:#6ea8fe; --up:#ff6b60; --down:#7aa2ff; --warn-bg:#2a2418; --warn-line:#5c4a1f;
    --chip:#212730;
  }
}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--text);
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic','맑은 고딕',sans-serif;
  font-size:17px; line-height:1.65; -webkit-text-size-adjust:100%}
.wrap{max-width:820px; margin:0 auto; padding:12px 14px 56px}
nav.tabs{display:flex; gap:6px; margin:2px 0 12px; overflow-x:auto}
nav.tabs a{flex:0 0 auto; padding:7px 13px; border-radius:999px; background:var(--chip);
  color:var(--muted); text-decoration:none; font-size:14px; font-weight:600; white-space:nowrap}
nav.tabs a.on{background:var(--accent); color:#fff}
header.top{padding:4px 2px 12px}
header.top .kicker{font-size:13px; color:var(--muted); letter-spacing:.04em}
header.top h1{margin:2px 0 0; font-size:25px; line-height:1.25; letter-spacing:-.02em}
header.top .sub{margin-top:6px; font-size:13px; color:var(--muted)}
/* overflow-wrap: 띄어쓰기 없는 긴 나열·글자로 적힌 주소가 카드를 뚫고 페이지를 옆으로 밀지 않게 */
section.card{background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:14px 16px; margin:12px 0; overflow-wrap:anywhere}
h2{font-size:18px; margin:2px 0 10px; letter-spacing:-.01em}
h3{font-size:16px; margin:16px 0 6px; color:var(--muted)}
p{margin:9px 0}
ul{margin:9px 0; padding-left:19px}
ol{margin:9px 0; padding-left:24px}
li{margin:5px 0}
hr{border:0; border-top:1px solid var(--line); margin:16px 0}
code{background:var(--bg); border:1px solid var(--line); border-radius:5px; padding:1px 5px; font-size:14px}
a{color:var(--accent)}
.up{color:var(--up); font-weight:700; font-variant-numeric:tabular-nums}
.down{color:var(--down); font-weight:700; font-variant-numeric:tabular-nums}
.flat{color:var(--muted); font-variant-numeric:tabular-nums}
/* 표는 절대 본문을 밀지 않는다 — 자기 안에서만 가로 스크롤.
   칸 안의 글은 줄을 바꾼다 (2026-11-10 점검 U1). 전엔 첫 열 말고는 전부 한 줄(nowrap)이라 글이 든 표가 화면의 몇 배~24배로
   늘어나고, 줄바꿈이 되는 첫 열만 한 글자 폭으로 눌렸다. 지금은:
     - 표는 화면 폭에 맞춘다 — 낱말 단위로 줄을 바꿔(keep-all) 들어갈 수 있으면 넘치지 않는다
     - 긴 글이 든 칸은 최소 폭을 지킨다(td.mid·td.long — mdToHtml 이 글 길이로 붙인다). 그 합이 화면보다 크면 그만큼만 표 안에서 옆으로 민다
     - overflow-wrap 은 break-word 여야 한다: anywhere 는 칸의 최소 폭을 한 글자로 만들어 다시 눌린다 */
.tw{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:10px -2px; padding-bottom:2px}
table{border-collapse:collapse; width:100%; font-size:15px}
th,td{padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top;
  word-break:keep-all; overflow-wrap:break-word}
th{font-size:13px; color:var(--muted); font-weight:600; background:var(--bg); white-space:nowrap}
tr:last-child td{border-bottom:0}
td.mid{min-width:8em}
td.long{min-width:15em}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
.note{background:var(--warn-bg); border:1px solid var(--warn-line); border-radius:10px;
  padding:10px 12px; margin:12px 0; font-size:14px}
.lead{font-size:16px; background:var(--chip); border-radius:10px; padding:12px 14px; margin:10px 0}
.lead ul{margin:0; padding-left:18px}
.lead ol{margin:0; padding-left:22px}
summary.more{cursor:pointer; font-weight:700}
.more-body{margin-top:10px}
footer{margin-top:26px; padding-top:14px; border-top:1px solid var(--line); font-size:13px; color:var(--muted)}
footer a{display:inline-block; margin-right:12px}
.arch{list-style:none; padding:0}
.arch li{margin:0; border-bottom:1px solid var(--line)}
.arch a{display:block; padding:13px 2px; text-decoration:none; color:var(--text); font-size:16px}
.arch .d{color:var(--muted); font-size:13px; margin-left:6px}

.lock{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); z-index:50}
.lock .box{text-align:center; padding:24px; max-width:360px}
.lock .ico{font-size:52px}
.lock h1{margin:8px 0 4px; font-size:24px}
.lock .sub{color:var(--muted); font-size:14px}
.lock button{margin-top:20px; background:var(--accent); color:#fff; border:0; padding:14px 28px; border-radius:28px; font-weight:700; font-size:16px; cursor:pointer}
.lock .st{margin-top:14px; color:var(--muted); font-size:14px}
.lock .er{margin-top:10px; color:var(--up); font-size:14px; white-space:pre-line}
.lock.resuming button,.lock.resuming .sub{display:none}
.lock.resuming .st:empty::after{content:'불러오는 중…'}
.lock.slow #btn-login,.lock.slow .sub{display:none}
.hidden{display:none !important}
nav.tabs a{cursor:pointer}
/* 위 줄 — 누르는 자리는 높이 40px (전엔 높이 17px 글자 링크였고 「로그아웃」이 「지난 회차」 바로 옆이었다) */
.bar{display:flex; justify-content:space-between; align-items:center; gap:8px; margin:0 0 8px; font-size:14px; color:var(--muted)}
.bar .nav{display:flex; align-items:center; gap:6px}
.bar a,.bar .now{display:inline-flex; align-items:center; min-height:40px; padding:0 13px; border-radius:999px; white-space:nowrap}
.bar a{cursor:pointer; background:var(--chip); color:var(--text); text-decoration:none; font-weight:600}
.lbl{display:inline-block; font-size:12px; padding:1px 7px; border-radius:999px; background:var(--chip); color:var(--muted); margin-left:6px}
.retry{margin-top:6px; background:var(--accent); color:#fff; border:0; padding:10px 20px; border-radius:22px; font-weight:700; font-size:15px; min-height:40px; cursor:pointer}
footer .out{display:inline-flex; align-items:center; min-height:40px; margin-top:8px; cursor:pointer; color:var(--muted); text-decoration:underline}
</style>
</head>
<body>
<div id="lock" class="lock"><div class="box">
  <div class="ico">📈</div>
  <h1>LifeOS 리포트</h1>
  <div class="sub">미국증시 브리핑 · 아마존 순위 · APR 조사 보고서<br>본인 구글 계정으로 로그인합니다</div>
  <button id="btn-login">구글 계정으로 로그인</button>
  <button id="btn-retry" class="hidden">다시 시도</button>
  <div id="lock-st" class="st"></div>
  <div id="lock-er" class="er"></div>
</div></div>
<script>
  // 로그인했던 기기면 버튼 대신 "불러오는 중…"을 먼저 보인다 (다른 웹앱과 같은 방식)
  try { if (localStorage.getItem('reports_signed_in') === '1') document.getElementById('lock').classList.add('resuming'); } catch (e) {}
</script>

<div id="app" class="wrap hidden">
  <nav class="tabs">
    <a data-kind="brief">미국증시</a><a data-kind="amazon">아마존 순위</a><a data-kind="research">조사 보고서</a>
  </nav>
  <div class="bar"><span class="nav" id="bar-left"></span><a id="bar-list">지난 회차</a></div>
  <header class="top">
    <div class="kicker" id="kicker"></div>
    <h1 id="heading"></h1>
    <div class="sub" id="sub"></div>
  </header>
  <div id="body"></div>
  <footer>
    <div>개인 기록용 자동 생성 페이지입니다. 투자 자문이 아닙니다.</div>
    <div><a id="bar-out" class="out">로그아웃</a></div>
  </footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const KINDS = { brief: '미국증시 브리핑', amazon: 'medicube 아마존 5개국', research: 'APR 조사 보고서' };
  const WD = ['일', '월', '화', '수', '목', '금', '토'];
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  const setSt = m => $('lock-st').textContent = m || '';
  const setEr = m => $('lock-er').textContent = m || '';
  $('btn-retry').onclick = () => location.reload();

  // firebase 스크립트를 못 받았으면(연결 문제) 여기서 알린다 — 전엔 스크립트가 죽어 「불러오는 중…」만 끝없이 보였다
  if (!window.firebase || !firebase.auth || !firebase.database) {
    $('lock').classList.remove('resuming'); $('lock').classList.add('slow');
    $('btn-retry').classList.remove('hidden');
    setEr('필요한 파일을 받지 못했습니다.\n연결을 확인하고 다시 시도해 주세요.');
    return;
  }

  firebase.initializeApp({"apiKey":"AIzaSyAPXiob8XeDunXpDMsLod_TwClqg2JL260","authDomain":"minsung-buboo2.firebaseapp.com","databaseURL":"https://minsung-buboo2-default-rtdb.asia-southeast1.firebasedatabase.app","projectId":"minsung-buboo2"});
  const auth = firebase.auth(), db = firebase.database();
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});

  $('btn-login').onclick = async () => {
    setEr(''); setSt('구글 로그인 창을 여는 중…');
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    try { await auth.signInWithPopup(provider); }
    catch (e) {
      if (['auth/popup-blocked', 'auth/popup-closed-by-user', 'auth/cancelled-popup-request', 'auth/operation-not-supported-in-this-environment'].includes(e.code)) {
        try { await auth.signInWithRedirect(provider); return; } catch (e2) { e = e2; }
      }
      setSt(''); setEr('로그인 실패: ' + (e.code || e.message));
    }
  };
  $('bar-out').onclick = () => auth.signOut();

  // ── 서버 읽기: 10초 안에 답이 없으면 실패로 돌려준다 (전엔 끝없이 「불러오는 중…」) ──
  const SLOW_MS = window.__SLOW_MS || 10000;
  function timed(promise) {
    return new Promise((res, rej) => {
      const t = setTimeout(() => { const e = new Error('slow'); e.code = 'slow'; rej(e); }, SLOW_MS);
      promise.then(v => { clearTimeout(t); res(v); }, e => { clearTimeout(t); rej(e); });
    });
  }

  // ── 상태 ──
  const index = {};      // kind → [{date, ...meta}] 최신순
  const indexAt = {};    // kind → 목록을 받은 시각
  const bodies = {};     // kind/date → { html, at }  (at = 그 회차가 저장된 시각. 다시 올라오면 새로 받는다)
  let cur = { kind: 'brief', date: null, list: false };
  let seq = 0;           // 그리기 순번 — 뒤에 시작한 그리기가 있으면 앞의 것은 손을 뗀다

  function parseHash() {
    const m = /^#(brief|amazon|research)(?:\/(list|\d{4}-\d{2}-\d{2}))?/.exec(location.hash);
    if (!m) return { kind: 'brief', date: null, list: false };
    return { kind: m[1], date: m[2] && m[2] !== 'list' ? m[2] : null, list: m[2] === 'list' };
  }
  function go(kind, date, list) { location.hash = '#' + kind + (list ? '/list' : date ? '/' + date : ''); }

  async function loadIndex(kind, fresh) {
    if (index[kind] && !fresh) return index[kind];
    const snap = await timed(db.ref('reports/index/' + kind).get());
    const v = snap.val() || {};
    index[kind] = Object.keys(v).filter(d => DATE_RE.test(d)).sort().reverse().map(d => Object.assign({}, v[d], { date: d }));
    indexAt[kind] = Date.now();
    return index[kind];
  }
  async function loadBody(kind, date, at) {
    const k = kind + '/' + date;
    if (bodies[k] && bodies[k].at === at) return bodies[k].html;
    const snap = await timed(db.ref('reports/body/' + kind + '/' + date).get());
    bodies[k] = { html: String((snap.val() || {}).html || ''), at: at };
    return bodies[k].html;
  }

  // ── 본문은 넣기 전에 거른다 ──
  // 발행 쪽(pagekit)이 글자를 바꿔 보내지만, 저장된 값이 무엇이든 여기서 스크립트·이벤트 속성이 살아남지 못하게 한다 —
  // 이 페이지는 가계부·일정과 같은 로그인으로 열린다. pagekit 이 새 태그를 쓰게 되면 OK_TAGS 에도 더한다
  // (모르는 태그는 껍데기만 벗기고 글은 남긴다. 속성은 class 와 http(s) 링크 주소만 남는다)
  const OK_TAGS = new Set('SECTION DIV P H2 H3 H4 H5 H6 UL OL LI TABLE THEAD TBODY TR TH TD STRONG EM CODE A SPAN DETAILS SUMMARY HR BR'.split(' '));
  const DROP_TAGS = new Set('SCRIPT STYLE IFRAME FRAME OBJECT EMBED LINK META BASE TITLE TEMPLATE SVG MATH FORM INPUT BUTTON TEXTAREA SELECT IMG PICTURE VIDEO AUDIO SOURCE CANVAS NOSCRIPT'.split(' '));
  function clean(html) {
    const doc = new DOMParser().parseFromString('<!doctype html><body>' + html, 'text/html');
    (function walk(node) {
      Array.from(node.children).forEach(el => {
        const tag = el.tagName.toUpperCase();
        if (DROP_TAGS.has(tag)) { el.remove(); return; }
        walk(el);
        if (!OK_TAGS.has(tag)) { el.replaceWith.apply(el, Array.from(el.childNodes)); return; }
        Array.from(el.attributes).forEach(at => {
          const n = at.name.toLowerCase();
          const keep = n === 'class' || (tag === 'A' && n === 'href' && /^https?:\/\//i.test(at.value.trim()));
          if (!keep) el.removeAttribute(at.name);
        });
        if (tag === 'A') el.setAttribute('rel', 'noopener noreferrer');
      });
    })(doc.body);
    const frag = document.createDocumentFragment();
    Array.from(doc.body.childNodes).forEach(n => frag.appendChild(n));
    return frag;
  }
  function setBody(node) { const b = $('body'); b.textContent = ''; b.appendChild(node); }
  // 이 페이지가 스스로 만드는 안내 글(안의 값은 esc 를 거친 것만 넣는다)
  function note(inner) { $('body').innerHTML = '<section class="card">' + inner + '</section>'; }

  function fmt(d) { const dt = new Date(d + 'T00:00:00'); return (dt.getMonth() + 1) + '월 ' + dt.getDate() + '일 (' + WD[dt.getDay()] + ')'; }

  function showError(what, e) {
    $('bar-left').textContent = '';
    const slow = e && e.code === 'slow';
    note('<p>' + (slow ? '연결이 느립니다. ' + esc(what) + '을(를) 받지 못했습니다.' : esc(what) + ' 불러오기 실패: ' + esc((e && (e.code || e.message)) || '')) + '</p>' +
      '<p><button class="retry" id="retry">다시 시도</button></p>');
    $('retry').onclick = render;
  }

  function drawBar(kind, date, list) {
    const pos = list.findIndex(it => it.date === date);
    if (pos < 0) { $('bar-left').textContent = ''; return; }
    $('bar-left').innerHTML =
      (pos < list.length - 1 ? '<a href="#' + kind + '/' + list[pos + 1].date + '">‹ 이전</a>' : '') +
      (pos > 0 ? '<a href="#' + kind + '/' + list[pos - 1].date + '">다음 ›</a>' : '<span class="now">최신</span>');
  }

  async function render() {
    const my = ++seq;
    cur = parseHash();
    document.querySelectorAll('nav.tabs a').forEach(a => a.classList.toggle('on', a.dataset.kind === cur.kind));
    note('<p class="flat">불러오는 중…</p>');
    $('kicker').textContent = KINDS[cur.kind]; $('heading').textContent = ''; $('sub').textContent = '';
    $('bar-left').textContent = '';
    let list;
    try { list = await loadIndex(cur.kind); }
    catch (e) { if (my === seq) showError('목록', e); return; }
    if (my !== seq) return;
    if (!list.length) { $('heading').textContent = '아직 회차가 없습니다'; $('body').textContent = ''; return; }

    if (cur.list) {
      $('heading').textContent = '지난 회차'; $('sub').textContent = list.length + '건';
      note('<ul class="arch">' + list.map(it =>
        '<li><a href="#' + cur.kind + '/' + it.date + '">' + esc(it.heading || fmt(it.date)) +
        (it.label ? '<span class="lbl">' + esc(it.label) + '</span>' : '') +
        '<span class="d">' + it.date + '</span></a></li>').join('') + '</ul>');
      return;
    }
    let date = cur.date;
    if (date && !list.some(it => it.date === date)) {
      // 받아 둔 목록에 없는 날짜 — 열어 둔 탭의 목록이 낡았을 수 있으니 한 번 새로 읽는다 (새 회차 링크를 눌렀는데 어제 것이 보이던 문제)
      try { list = await loadIndex(cur.kind, true); }
      catch (e) { if (my === seq) showError('목록', e); return; }
      if (my !== seq) return;
      if (!list.some(it => it.date === date)) {
        // 그래도 없으면 조용히 최신으로 바꾸지 않는다
        $('heading').textContent = '이 회차는 아직 없습니다'; $('sub').textContent = date;
        note('<p>' + esc(date) + ' 회차가 목록에 없습니다. 아직 올라오지 않았거나 주소가 다릅니다.</p>' +
          '<p><a href="#' + cur.kind + '">최신 회차 보기</a> · <a href="#' + cur.kind + '/list">지난 회차</a></p>');
        return;
      }
    }
    if (!date) { if (!list.length) return; date = list[0].date; }
    const meta = list.find(it => it.date === date);
    $('heading').textContent = meta.heading || fmt(date);
    $('sub').textContent = meta.sub || date;
    drawBar(cur.kind, date, list);
    let html;
    try { html = await loadBody(cur.kind, date, meta.at); }
    catch (e) { if (my === seq) showError('본문', e); return; }
    if (my !== seq) return;
    if (html) setBody(clean(html)); else note('<p>본문이 없습니다.</p>');
    window.scrollTo(0, 0);
  }

  // 화면이 다시 보였을 때: 목록을 받은 지 3분이 넘었으면 새로 읽는다 (탭을 열어 둔 채 다음 날 다시 보는 경우)
  const STALE_MS = window.__STALE_MS || 3 * 60 * 1000;
  const sig = list => (list || []).map(it => it.date + ':' + it.at).join(',');
  async function refreshIfStale() {
    if ($('app').classList.contains('hidden')) return;
    const kind = cur.kind;
    if (Date.now() - (indexAt[kind] || 0) < STALE_MS) return;
    const before = sig(index[kind]);
    let list;
    try { list = await loadIndex(kind, true); } catch (e) { return; }   // 못 읽으면 지금 화면 그대로 둔다
    if (sig(list) === before) return;
    const p = parseHash();
    if (p.kind !== kind) return;
    // 「최신」이나 목록을 보고 있었으면 새로 그린다. 특정 회차를 읽는 중이면 화면은 두고(읽던 자리 유지) 이전·다음 줄만 맞춘다
    if (p.list || !p.date) render(); else drawBar(kind, p.date, list);
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refreshIfStale(); });
  window.addEventListener('pageshow', e => { if (e.persisted) refreshIfStale(); });

  document.querySelectorAll('nav.tabs a').forEach(a => a.onclick = () => go(a.dataset.kind));
  $('bar-list').onclick = () => go(cur.kind, null, true);
  window.addEventListener('hashchange', render);

  // 로그아웃: 받아 둔 목록·본문과 화면을 비운다 (전엔 화면만 가려서 그 탭에 본문이 남았고, 같은 탭에서 다른 계정으로 로그인하면 보였다)
  function wipe() {
    seq++;
    [index, indexAt, bodies].forEach(o => Object.keys(o).forEach(k => delete o[k]));
    ['body', 'heading', 'sub', 'kicker', 'bar-left'].forEach(id => { $(id).textContent = ''; });
  }

  auth.onAuthStateChanged(async user => {
    $('lock').classList.remove('slow'); $('btn-retry').classList.add('hidden');
    if (!user) {
      try { localStorage.removeItem('reports_signed_in'); } catch (e) {}
      wipe();
      $('lock').classList.remove('resuming', 'hidden'); $('app').classList.add('hidden'); setSt(''); return;
    }
    setSt('불러오는 중…');
    try {
      // 권한 확인 겸 첫 목록 — 받아 둔 것을 쓰지 않고 서버에서 읽는다. 규칙이 막으면 permission-denied
      await loadIndex(parseHash().kind, true);
      try { localStorage.setItem('reports_signed_in', '1'); } catch (e) {}
      setSt(''); setEr('');
      $('lock').classList.add('hidden'); $('app').classList.remove('hidden');
      render();
    } catch (e) {
      setSt(''); $('lock').classList.remove('resuming');
      if (e && e.code === 'slow') {
        // 연결이 느린 것은 권한 문제가 아니다 — 로그아웃시키지 않고 다시 시도하게 한다
        $('lock').classList.add('slow'); $('btn-retry').classList.remove('hidden');
        setEr('연결이 느립니다. 잠시 뒤 다시 시도해 주세요.');
        return;
      }
      setEr('이 계정은 읽기 권한이 없습니다 (' + user.email + ')\n' + (e.code || e.message));
      await auth.signOut();
    }
  });
})();
</script>
</body></html>
